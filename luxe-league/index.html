<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#070b14" />
  <title>Luxe League — Supercar Soccer</title>
  <style>
    :root {
      --blue: #3d8bff;
      --orange: #ff8c1a;
      --gold: #e8c66a;
      --ink: #eaf0ff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #070b14; }
    body {
      font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      -webkit-user-select: none; user-select: none;
      touch-action: none;
    }
    #game-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

    .overlay {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 20;
      background: radial-gradient(ellipse at 50% 30%, rgba(10, 16, 34, 0.55), rgba(5, 8, 16, 0.88));
      backdrop-filter: blur(2px);
    }
    .hidden { display: none !important; }

    h1.logo {
      font-size: clamp(2.2rem, 7vw, 4.2rem);
      font-weight: 900; font-style: italic; letter-spacing: 0.06em;
      background: linear-gradient(120deg, #fff 10%, var(--gold) 45%, #b78b2e 60%, #fff6d8 90%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-transform: uppercase;
      filter: drop-shadow(0 2px 18px rgba(232, 198, 106, 0.35));
    }
    .tag { margin-top: 0.2rem; letter-spacing: 0.45em; text-transform: uppercase; font-size: 0.72rem; color: #9fb0d8; }

    .garage {
      margin-top: 1.4rem; display: flex; align-items: center; gap: 0.8rem;
      width: min(540px, 94vw);
    }
    .arrow {
      flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%;
      border: 1px solid rgba(232, 198, 106, 0.5); background: rgba(14, 20, 38, 0.7);
      color: var(--gold); font-size: 1.3rem; cursor: pointer; transition: 0.15s;
    }
    .arrow:hover { background: rgba(232, 198, 106, 0.18); }
    .car-card {
      flex: 1; background: linear-gradient(160deg, rgba(17, 24, 46, 0.92), rgba(9, 13, 26, 0.92));
      border: 1px solid rgba(232, 198, 106, 0.35); border-radius: 14px;
      padding: 1rem 1.2rem; min-height: 178px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }
    .car-name { font-size: 1.35rem; font-weight: 800; font-style: italic; letter-spacing: 0.03em; }
    .car-tagline { margin-top: 0.25rem; font-size: 0.8rem; color: #9fb0d8; line-height: 1.35; min-height: 2.2em; }
    .stats { margin-top: 0.7rem; display: grid; grid-template-columns: 5.5em 1fr; gap: 0.32rem 0.6rem; align-items: center; }
    .stats label { font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase; color: #7d8db4; }
    .bar { height: 7px; border-radius: 4px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
    .bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--gold), #fff2c4); }

    .opts { margin-top: 1.1rem; display: flex; gap: 1.6rem; flex-wrap: wrap; justify-content: center; }
    .opt-group { text-align: center; }
    .opt-group .opt-label { font-size: 0.62rem; letter-spacing: 0.22em; text-transform: uppercase; color: #7d8db4; margin-bottom: 0.4rem; }
    .seg { display: inline-flex; border: 1px solid rgba(159, 176, 216, 0.35); border-radius: 9px; overflow: hidden; }
    .seg button {
      padding: 0.45rem 0.9rem; background: transparent; border: 0; color: #9fb0d8;
      font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: 0.15s;
    }
    .seg button + button { border-left: 1px solid rgba(159, 176, 216, 0.25); }
    .seg button.on { background: rgba(232, 198, 106, 0.9); color: #14110a; }

    .big-btn {
      margin-top: 1.5rem; padding: 0.85rem 3.2rem; font-size: 1.05rem; font-weight: 800;
      font-style: italic; letter-spacing: 0.14em; text-transform: uppercase;
      color: #14110a; background: linear-gradient(120deg, #fff2c4, var(--gold) 60%, #c69b3a);
      border: 0; border-radius: 11px; cursor: pointer;
      box-shadow: 0 6px 30px rgba(232, 198, 106, 0.35);
      transition: transform 0.12s;
    }
    .big-btn:hover { transform: scale(1.04); }
    .ghost-btn {
      margin-top: 0.9rem; padding: 0.6rem 1.8rem; background: transparent; cursor: pointer;
      border: 1px solid rgba(159, 176, 216, 0.4); border-radius: 9px; color: #9fb0d8;
      font-size: 0.85rem; letter-spacing: 0.08em;
    }
    .hint { margin-top: 1.3rem; font-size: 0.7rem; color: #66759c; text-align: center; line-height: 1.7; max-width: 90vw; }
    .hint b { color: #9fb0d8; }

    /* ------- HUD ------- */
    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    #scoreboard {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: stretch; border-radius: 12px; overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.55); font-weight: 900;
    }
    .score-cell { padding: 0.5rem 1.15rem; font-size: 1.5rem; min-width: 64px; text-align: center; }
    #score-blue { background: linear-gradient(180deg, #2d6fe0, #1d4eaa); }
    #score-orange { background: linear-gradient(180deg, #f08018, #c4640e); }
    #clock-cell { background: rgba(8, 12, 24, 0.88); padding: 0.5rem 1.1rem; display: flex; flex-direction: column; justify-content: center; }
    #clock { font-size: 1.18rem; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
    #clock.ot { color: var(--gold); }

    #boost-wrap { position: absolute; right: 18px; bottom: 18px; width: min(230px, 38vw); text-align: right; }
    #speed { font-size: 0.95rem; font-weight: 700; color: #c9d6f5; margin-bottom: 5px; font-variant-numeric: tabular-nums; }
    #speed small { font-size: 0.6rem; color: #7d8db4; letter-spacing: 0.15em; }
    #boost-bar {
      height: 14px; border-radius: 8px; background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(232, 198, 106, 0.4); overflow: hidden;
    }
    #boost-fill {
      height: 100%; width: 33%; border-radius: 7px;
      background: linear-gradient(90deg, #c69b3a, var(--gold), #fff2c4);
      box-shadow: 0 0 14px rgba(232, 198, 106, 0.8);
      transition: width 0.08s linear;
    }
    #boost-label { font-size: 0.58rem; letter-spacing: 0.3em; color: #7d8db4; margin-top: 4px; text-transform: uppercase; }

    #banner {
      position: absolute; top: 24%; left: 0; right: 0; text-align: center;
      font-size: clamp(2rem, 9vw, 4.6rem); font-weight: 900; font-style: italic;
      letter-spacing: 0.05em; text-transform: uppercase;
      text-shadow: 0 4px 30px rgba(0, 0, 0, 0.7);
      opacity: 0; transform: scale(0.8); transition: opacity 0.18s, transform 0.18s;
    }
    #banner.show { opacity: 1; transform: scale(1); }
    #sub-banner {
      position: absolute; top: 38%; left: 0; right: 0; text-align: center;
      font-size: clamp(0.8rem, 3vw, 1.2rem); letter-spacing: 0.3em; text-transform: uppercase;
      color: #c9d6f5; text-shadow: 0 2px 14px rgba(0, 0, 0, 0.8);
      opacity: 0; transition: opacity 0.2s;
    }
    #sub-banner.show { opacity: 1; }

    /* ------- touch controls ------- */
    #touch { position: fixed; inset: 0; z-index: 15; pointer-events: none; }
    .tbtn {
      position: absolute; width: 76px; height: 76px; border-radius: 50%;
      background: rgba(20, 28, 52, 0.55); border: 1px solid rgba(159, 176, 216, 0.5);
      color: #c9d6f5; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.1em;
      display: flex; align-items: center; justify-content: center;
      pointer-events: auto; -webkit-tap-highlight-color: transparent;
    }
    .tbtn.active { background: rgba(232, 198, 106, 0.5); }
    #t-boost { right: 22px; bottom: 96px; }
    #t-jump { right: 112px; bottom: 30px; }
    #t-stick-zone { position: absolute; left: 0; bottom: 0; width: 45%; height: 60%; pointer-events: auto; }
    #t-stick {
      position: absolute; width: 110px; height: 110px; border-radius: 50%;
      border: 1px solid rgba(159, 176, 216, 0.45); background: rgba(20, 28, 52, 0.35);
      display: none; pointer-events: none;
    }
    #t-knob {
      position: absolute; width: 48px; height: 48px; border-radius: 50%;
      background: rgba(232, 198, 106, 0.7); left: 31px; top: 31px; pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="hud">
    <div id="scoreboard" class="hidden">
      <div class="score-cell" id="score-blue">0</div>
      <div id="clock-cell"><div id="clock">5:00</div></div>
      <div class="score-cell" id="score-orange">0</div>
    </div>
    <div id="banner"></div>
    <div id="sub-banner"></div>
    <div id="boost-wrap" class="hidden">
      <div id="speed">0 <small>KM/H</small></div>
      <div id="boost-bar"><div id="boost-fill"></div></div>
      <div id="boost-label">Boost</div>
    </div>
  </div>

  <div id="touch" class="hidden">
    <div id="t-stick-zone"></div>
    <div id="t-stick"><div id="t-knob"></div></div>
    <div class="tbtn" id="t-boost">BOOST</div>
    <div class="tbtn" id="t-jump">JUMP</div>
  </div>

  <div id="menu" class="overlay">
    <h1 class="logo">Luxe League</h1>
    <div class="tag">Supercar Soccer</div>

    <div class="garage">
      <button class="arrow" id="prev-car">&#9664;</button>
      <div class="car-card">
        <div class="car-name" id="car-name"></div>
        <div class="car-tagline" id="car-tagline"></div>
        <div class="stats">
          <label>Speed</label><div class="bar"><i id="st-speed"></i></div>
          <label>Boost</label><div class="bar"><i id="st-boost"></i></div>
          <label>Handling</label><div class="bar"><i id="st-handling"></i></div>
          <label>Power</label><div class="bar"><i id="st-power"></i></div>
        </div>
      </div>
      <button class="arrow" id="next-car">&#9654;</button>
    </div>

    <div class="opts">
      <div class="opt-group">
        <div class="opt-label">Opponent</div>
        <div class="seg" id="seg-difficulty">
          <button data-v="rookie">Rookie</button>
          <button data-v="pro" class="on">Pro</button>
          <button data-v="legend">Legend</button>
        </div>
      </div>
      <div class="opt-group">
        <div class="opt-label">Match</div>
        <div class="seg" id="seg-duration">
          <button data-v="120">2:00</button>
          <button data-v="300" class="on">5:00</button>
          <button data-v="600">10:00</button>
        </div>
      </div>
    </div>

    <button class="big-btn" id="start-btn">Start Match</button>
    <div class="hint">
      <b>W/S</b> throttle &nbsp;·&nbsp; <b>A/D</b> steer &nbsp;·&nbsp; <b>SPACE</b> jump (twice = dodge)
      &nbsp;·&nbsp; <b>SHIFT</b> boost<br/>
      <b>C</b> camera &nbsp;·&nbsp; <b>P</b> pause &nbsp;·&nbsp; <b>M</b> mute
      &nbsp;·&nbsp; score in the <span style="color:var(--orange)">orange</span> goal
    </div>
  </div>

  <div id="pause" class="overlay hidden">
    <h1 class="logo" style="font-size:2.4rem">Paused</h1>
    <button class="big-btn" id="resume-btn">Resume</button>
    <button class="ghost-btn" id="quit-btn">Back to garage</button>
  </div>

  <div id="end" class="overlay hidden">
    <h1 class="logo" id="end-title">Victory</h1>
    <div class="tag" id="end-score">0 — 0</div>
    <button class="big-btn" id="rematch-btn">Rematch</button>
    <button class="ghost-btn" id="garage-btn">Back to garage</button>
  </div>

  <script type="module" src="./game.js"></script>
</body>
</html>
